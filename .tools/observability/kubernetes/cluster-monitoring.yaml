apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cp-monitoring-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cp-monitoring-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cp-monitoring-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: telemetry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: telemetry
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # --- add-on scraping (generic; workloads opt in via annotations) ---
      # Any pod annotated prometheus.io/scrape=true is scraped, using its
      # prometheus.io/{path,port,scheme} annotations. camberfs pods carry these
      # already; a personal project just adds the same annotations, no edit here.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app

      # --- standing exporters (generic; workloads in exporters.yaml) ---
      # node-exporter: node cpu/mem/disk/network/load. instance = node name.
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: telemetry;node-exporter;metrics
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: kubernetes_node

      # kube-state-metrics: limits/requests, allocatable, phase, restarts, conditions.
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: telemetry;kube-state-metrics;http-metrics

      # Per-pod / per-node CPU and working set. 2s so short install-time peaks
      # aren't averaged away; drop to 15s for long-lived deployments.
      - job_name: kubernetes-cadvisor
        scheme: https
        scrape_interval: 2s
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true   # kubelet serving certs are often self-signed
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubelet's own /metrics via the apiserver proxy (running pods, volume stats).
      - job_name: kubernetes-nodes-kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            action: replace
            target_label: kubernetes_node
        # Drop the most expensive kubelet histograms; counters and gauges are kept.
        metric_relabel_configs:
          - source_labels: [__name__]
            action: drop
            regex: '(rest_client_request_duration_seconds|kubelet_runtime_operations_duration_seconds|storage_operation_duration_seconds|kubelet_pod_start_duration_seconds|kubelet_pod_worker_duration_seconds|kubelet_cgroup_manager_duration_seconds)_bucket'

      # Apiserver metrics (RSS, request rates by verb, apiserver_storage_objects).
      - job_name: kubernetes-apiservers
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
        # Drop the very high-cardinality apiserver histograms.
        metric_relabel_configs:
          - source_labels: [__name__]
            action: drop
            regex: '(apiserver_request_duration_seconds|apiserver_response_sizes|apiserver_request_filter_duration_seconds|apiserver_request_sli_duration_seconds|etcd_request_duration_seconds|rest_client_request_duration_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds)_bucket'

      # etcd server metrics (WAL fsync p99, DB size), the sizing-harness health gate.
      # kubeadm: discovers etcd static pods; stays DOWN unless etcd's
      # --listen-metrics-urls includes a node-reachable address.
      - job_name: kubernetes-etcd
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            action: keep
            regex: etcd
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: $1:2381
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: kubernetes_node

      # k0s variant: etcd is a host process, not a pod. Replace the job above
      # with this one, filling in controller IPs, and set in the k0s config:
      #   spec.etcd.extraArgs:
      #     listen-metrics-urls: http://0.0.0.0:2381
      # - job_name: kubernetes-etcd
      #   static_configs:
      #     - targets:
      #         - <controller-1-ip>:2381
      #         - <controller-2-ip>:2381
      #         - <controller-3-ip>:2381
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: telemetry
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate   # single replica; avoids RWO PVC deadlock if you switch to a PVC
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-lifecycle   # POST /-/reload after a ConfigMap change
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # Throwaway storage: fine for validation clusters, lost on pod restart.
        # For durable data swap in a PVC (keep strategy: Recreate above).
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: telemetry
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 32090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: telemetry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
# Generic Prometheus datasource (project agnostic).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: telemetry
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.telemetry.svc:9090
        isDefault: true
        editable: true
---
# Dashboard provider: Grafana loads any file the sidecar drops in this dir.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: telemetry
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: sidecar
        orgId: 1
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: telemetry
---
# Lets the dashboard sidecar discover labeled ConfigMaps cluster wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-dashboard-sidecar
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-dashboard-sidecar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-dashboard-sidecar
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: telemetry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: grafana-port
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "100m"
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: grafana-storage
            # datasource + dashboard provider are generic (project agnostic)
            - mountPath: /etc/grafana/provisioning/datasources
              name: grafana-datasource
              readOnly: true
            - mountPath: /etc/grafana/provisioning/dashboards
              name: grafana-dashboards-provider
              readOnly: true
            # dashboards land here from the sidecar (shared, ephemeral)
            - mountPath: /var/lib/grafana/dashboards
              name: sc-dashboards
        # Watches ConfigMaps labeled grafana_dashboard=1 in any namespace and
        # writes them into the shared dashboards dir. Add-ons ship a labeled
        # ConfigMap; no edit here to add or remove a dashboard.
        - name: grafana-sc-dashboards
          image: kiwigrid/k8s-sidecar:1.27.4
          env:
            - name: LABEL
              value: grafana_dashboard
            - name: LABEL_VALUE
              value: "1"
            - name: FOLDER
              value: /var/lib/grafana/dashboards
            - name: RESOURCE
              value: configmap
            - name: NAMESPACE
              value: ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - mountPath: /var/lib/grafana/dashboards
              name: sc-dashboards
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
        - name: grafana-datasource
          configMap:
            name: grafana-datasource
        - name: grafana-dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: sc-dashboards
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: telemetry
spec:
  # ClusterIP: external access is via grafana-external.yaml (NodePort 32001),
  # so the core Service claims no fixed node port and cannot collide.
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana
  type: ClusterIP
