apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-control-plane
  namespace: telemetry
  labels:
    grafana_dashboard: "1"
data:
  control-plane.json: |
    {
      "uid": "cp-sizing",
      "title": "Control Plane Sizing",
      "tags": [
        "control-plane",
        "sizing"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 0,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROM",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {}
          },
          {
            "name": "cp_node",
            "label": "CP node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROM}"
            },
            "query": "label_values(container_memory_working_set_bytes{pod=~\"kube-apiserver-.*\"}, instance)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Control-plane node totals",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU used (cores)",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "pointSize": 4,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        8,
                        8
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "sum by (instance) (rate(container_cpu_usage_seconds_total{id=\"/\",instance=~\"$cp_node\"}[$__rate_interval]))",
              "legendFormat": "{{instance}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "machine_cpu_cores{instance=~\"$cp_node\"}",
              "legendFormat": "{{instance}} capacity"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memory working set",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "pointSize": 4,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "B"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "dash": [
                        8,
                        8
                      ],
                      "fill": "dash"
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "container_memory_working_set_bytes{id=\"/\",instance=~\"$cp_node\"}",
              "legendFormat": "{{instance}}"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "machine_memory_bytes{instance=~\"$cp_node\"}",
              "legendFormat": "{{instance}} capacity"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Root filesystem used %",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "pointSize": 4,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "dashed+area"
                }
              },
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROM}"
              },
              "expr": "100 * container_fs_usage_bytes{id=\"/\",device=~\"/dev/.da[0-9]*\",instance=~\"$cp_node\"} / container_fs_limit_bytes{id=\"/\",device=~\"/dev/.da[0-9]*\",instance=~\"$cp_node\"}",
              "legendFormat": "{{instance}} {{device}}"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Running pods",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROM}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "pointSize": 4,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
