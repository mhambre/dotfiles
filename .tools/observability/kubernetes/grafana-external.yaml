# Optional external access to Grafana. Apply only if you want to reach it from
# outside the cluster. The base cluster-monitoring.yaml already exposes Grafana
# on NodePort 32000; this adds a distinct, clearly named external endpoint.
#
#   kubectl apply -f manifests/grafana-external.yaml
#
# Default below is a NodePort on 32001 reachable at http://<any-node-ip>:32001.
# For a routable IP instead, use one of the commented variants.
apiVersion: v1
kind: Service
metadata:
  name: grafana-external
  namespace: telemetry
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 32001
  # Pin the NodePort to specific node external IPs instead of all nodes:
  # externalIPs:
  #   - <node-external-ip>
---
# LoadBalancer variant. Uncomment if the cluster has a cloud LB or MetalLB.
# Gives Grafana its own external IP on port 3000.
